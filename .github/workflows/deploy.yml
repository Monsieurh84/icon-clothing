name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Catalogue, fiches produits et photos
        run: |
          pip install -q --break-system-packages pillow || pip install -q pillow || true
          python3 build.py https://icon-clothing.fr || echo "Catalogue indisponible, on garde la version precedente"
      - name: Enregistrer les photos dans le depot
        run: |
          git config user.name "Monsieur.H"
          git config user.email "actions@users.noreply.github.com"
          for d in img data; do [ -e "$d" ] && git add "$d" || true; done
          git diff --cached --quiet || (git commit -m "Photos et catalogue" && (git pull --rebase -q && git push) || echo "push ignore")
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
